services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dedp
      POSTGRES_PASSWORD: dedp
      POSTGRES_DB: dedp
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dedp"]
      interval: 2s
      retries: 15

  lab:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_DSN: postgresql://dedp:dedp@postgres:5432/dedp
    volumes:
      - .:/work
